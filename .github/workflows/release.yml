# Push a tag like v0.1.0 to publish a GitHub Release with the Windows installer and binaries.
# "Run workflow" (manual) builds the same files as run artifacts, without publishing a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release --locked
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $icon = (Get-ChildItem target\release\build -Recurse -Filter monitorctl.ico | Select-Object -First 1).FullName
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DExe=target\release\monitorctl.exe" "/DIcon=$icon" "/O$pwd\dist" installer\monitorctl.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item target\release\monitorctl.exe dist\monitorctl-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release --locked
      - run: |
          mkdir dist
          strip --strip-debug -o dist/monitorctl-linux-x64 target/release/monitorctl
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "monitorctl $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
